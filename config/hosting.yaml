# ============================================================
# 本地素材托管 —— 让电脑上的图片/视频能被生成接口当参考（2026-09-19）
# ============================================================
# 生成接口（seedance / gpt-image 等）只收**公网链接**，本地路径和 base64 都不行；
# 生成结果自带的链接约 24 小时失效。所以本地素材要先传到你自己的存储拿到链接，
# 之后：drama_use_local_ref 把本地图放进参考图包、drama_refresh_refs 用本地副本
# 重新上传刷新过期链接、渲染时自动把过期/本地的参考重新托管。
#
# type 四选一（none = 不托管，本地素材只能拼接不能当参考）：
#   imghost   传到图床拿链接 ←←← **没有对象存储的话用这个**
#   command   跑一条你自己的上传命令（ossutil / coscli / picgo 都行）
#   s3        S3 兼容对象存储：阿里云 OSS、腾讯云 COS、Cloudflare R2、MinIO、AWS S3
#   http_put  自建 nginx / WebDAV：PUT 到 base_url/文件名，公网地址 = public_base/文件名

type: imghost

# ---------- imghost ----------
# 没有对象存储时的路子：把图传到图床换一个公网链接。
# ⚠️ 图床是**第三方公网服务**，传上去的图谁拿到链接谁就能看。只传当参考用的
#    角色图 / 场景图，别传不该外流的东西。
#
# preset 选一个站：
#   imgbb      imgbb.com 免费注册拿 API key → .env 里 IMGBB_API_KEY=xxx
#              图片长期保存，能在自己账号里删
#   see        S.EE（原 sm.ms 团队，sm.ms 已迁移过去）注册拿 API key
#              → .env 里 SEE_API_TOKEN=xxx；国内可直连，图归你账号能自己删
#              注意：老的 sm.ms 上传接口现在对所有人只读，带 token 也是 401
#   catbox     不用注册，图片永久公开
#   litterbox  不用注册，72 小时后自动删（够渲染期间用，过期渲染前会自动重传）
#   custom     自己写下面的 endpoint / field / url_path
#
# 换成 imghost 之后：hosting_status 看状态，host_file 传单张，
# 短剧里 drama_use_local_ref 直接把本地图放进参考图包。
imghost:
  preset: see             # see / imgbb / catbox / litterbox / custom
  # ---- 下面几项只在 preset: custom 时生效；选了具体 preset 一律以 preset 为准 ----
  endpoint: ""            # 上传地址（POST multipart）
  field: "file"           # 文件用哪个表单字段名
  form: {}                # 额外表单字段，如 {reqtype: fileupload}
  headers: {}             # 额外请求头
  url_path: ""            # 链接在响应 JSON 里的位置，如 data.url；留空按纯文本取
  token_env: ""           # key 放 .env，这里只写变量名
  token_in: "query:key"   # key 放哪：query:参数名 / header:头名 / form:字段名

# ---------- command ----------
# 命令要把最终公网链接打印到 stdout（取最后一行以 http 开头的）。占位符：
#   {file} 本地路径   {name} 文件名   {stem} 不含后缀   {ext} 后缀（含点）
# 例（阿里云 ossutil）：
#   ossutil cp "{file}" oss://my-bucket/aigc-refs/{name} && echo https://my-bucket.oss-cn-hangzhou.aliyuncs.com/aigc-refs/{name}
command: ""

# ---------- s3 ----------
s3:
  endpoint: ""            # https://oss-cn-hangzhou.aliyuncs.com / https://cos.ap-shanghai.myqcloud.com / https://<账号>.r2.cloudflarestorage.com
  region: ""              # OSS 填 oss-cn-hangzhou 这类；COS 填 ap-shanghai；R2 填 auto
  bucket: ""
  prefix: "aigc-refs/"    # 对象名前缀
  public_base: ""         # 公网访问前缀（配了 CDN 就填 CDN），留空按 endpoint/bucket 拼
  path_style: false       # R2 / MinIO 用 true（endpoint/bucket/key），OSS / COS 用 false（bucket.endpoint/key）
  acl: "public-read"      # 桶本身不公开时靠这个让对象可读；桶已公开可留空
  access_key_env: S3_ACCESS_KEY   # 密钥放 .env，这里只写变量名
  secret_key_env: S3_SECRET_KEY

# ---------- http_put ----------
http_put:
  base_url: ""            # PUT 的目标前缀，如 https://files.example.com/upload/
  public_base: ""         # 公网读取前缀，如 https://files.example.com/
  auth_header: ""         # 如 "Bearer xxx"，不需要留空

ttl_hours: 0              # 托管后的链接多久过期；0 = 不过期（自家存储正常不过期）
