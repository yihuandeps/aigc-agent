# ============================================================
# 一集的规格 —— 用户 2026-09-18 定的
# ============================================================
# 贯穿整条短剧链：写剧本（字数目标）、拆分镜（镜头数与开场高潮点）、
# 视频提示词（单段时长与总时长）。改这里，不改代码。

episode:
  minutes: 4            # 一集成片时长（分钟）
  tolerance: 0.15       # 分镜/提示词总时长允许偏差（±15%）
  chars_per_minute: 320 # 剧本字数估算（台词 + 动作），4 分钟 ≈ 1280 字

hook:
  seconds: 15           # 短视频平台要高节奏：开场这几秒内必须给一个高潮点

shot:
  min_seconds: 10       # 单段视频最短
  max_seconds: 15       # 单段视频最长（seedance 2.0 单段上限）

# 单个镜头（分镜行 / 段内切镜）—— 用户 2026-09-20 定的硬性要求：
# 不管一集多长，每一个镜头必须控制在 3 秒以内。一段 10–15 秒的生成视频是多镜头快切，
# 段内每个镜头 ≤ max_seconds。贯穿写剧本（短拍）、拆分镜（每行标时长）、提示词（cuts 字段）、
# 渲染（提示词硬约束 + ffmpeg 场景切换检测，超了重生成；开关见 media_models.yaml drama.cut_gate）。
# 配方短视频链的快切上限（config/recipes/*.yaml cut.max_seconds）也不会超过这里的值。
cut:
  max_seconds: 3
  min_seconds: 1        # 太短看不清
