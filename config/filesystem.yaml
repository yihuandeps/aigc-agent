# ============================================================
# 本地文件系统工具（fs_list / fs_read / fs_write / fs_import …）的边界
# ============================================================
# 项目目录、workspace、产物目录**永远**可访问，不用写在这里。
# 其余目录要访问就加进 roots；不在 roots 里的路径工具会拒绝并提示改这里。
# 改完重启 agent 生效。

roots:
  - "~"          # 当前用户主目录（桌面、文档、下载…）
  - "E:/"        # 素材盘

# 素材目录（2026-09-20）：除产物目录外，还要当「已有素材」自动索引的文件夹（自动算进 roots）。
# find_materials / find_episode 会在这些目录里按文件名认集号（第6集 / ep6_ / EP06 …）和类型，
# 每轮把「有哪些文件、覆盖哪些集」的摘要放进模型上下文。产物目录本身不用写，永远在索引里。
# 只放素材文件夹，别把整个盘配进来（单目录最多索引 4000 个文件，超了只取前面的）。
material_dirs: []
#  - "E:/视频素材"
#  - "E:/剧本"

# 永远不读不写：凭据、虚拟环境、版本库、系统目录。通配符按完整路径匹配。
deny:
  - "**/.env"
  - "**/.env.*"
  - "**/*.pem"
  - "**/*.key"
  - "**/*.pfx"
  - "**/id_rsa*"
  - "**/.venv/**"
  - "**/.git/**"
  - "**/__pycache__/**"
  - "**/node_modules/**"
  - "C:/Windows/**"
  - "C:/Program Files/**"
  - "C:/Program Files (x86)/**"

max_read_bytes: 2000000   # 单个文本文件读取上限（2MB），大文件用 offset 分段
max_list: 500             # fs_list 单页最多条目
max_search_files: 5000    # fs_search 最多扫多少个文件
