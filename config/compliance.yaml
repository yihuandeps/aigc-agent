# ============================================================
# 机审规则 —— 由 M15 Compliance 读取。数据不是代码：运营/法务改这里，不动 Python。
# ============================================================
#
# 三条原则：
#   1. 机审只出**风险清单 + 定位 + 建议改法**，不自动删改。改不改是人的决定。
#   2. 分级：block = 不改不能打包发布；warn = 需人工判断；info = 提示。
#   3. ⚠️ 下面是**起步清单，不是完整合规库**。违禁词按各平台最新规则补全，
#      行业特殊限制（医疗/金融/教育/食品）按业务线加。改完存盘即生效。
# ============================================================

version: "2026-09-17"

# ---------- 词表类规则 ----------
# 每组：severity + words + suggestion。命中即报，给出行号与上下文片段。
rules:

  absolute_claims:
    label: 广告法极限词
    severity: block
    applies_to: [text, outline]   # 只查这些资产类型；剧本（script）台词不过这一类
    suggestion: 换成可验证的具体描述，或直接删掉程度词
    words:
      - 最佳
      - 最好
      - 最优
      - 最强
      - 第一
      - 顶级
      - 顶尖
      - 国家级
      - 世界级
      - 全球首
      - 史上最
      - 100%
      - 百分百
      - 绝对
      - 唯一
      - 独家
      - 永久
      - 万能

  medical_claims:
    label: 医疗功效宣称
    severity: block
    applies_to: [text, outline]   # 只查这些资产类型；剧本（script）台词不过这一类
    suggestion: 非药品、非医疗器械不得宣称疗效；改成体验描述并去掉功效词
    words:
      - 治愈
      - 根治
      - 药到病除
      - 无副作用
      - 抗癌
      - 降血压
      - 降血糖
      - 消炎杀菌
      - 壮阳

  finance_claims:
    label: 金融收益承诺
    severity: block
    applies_to: [text, outline]   # 只查这些资产类型；剧本（script）台词不过这一类
    suggestion: 不得承诺收益或保本；改成风险提示 + 客观描述
    words:
      - 稳赚
      - 保本
      - 零风险
      - 无风险
      - 保收益
      - 稳赚不赔
      - 躺赚
      - 必涨

  sensitive_topics:
    label: 敏感话题
    severity: warn
    suggestion: 涉及敏感话题，需人工判断是否适合发布、措辞是否稳妥
    words:
      - 政治
      - 宗教
      - 民族
      - 赌博
      - 毒品
      - 色情
      - 自杀
      - 恐怖袭击

  inducement:
    label: 诱导互动 / 站外引流
    severity: warn
    applies_to: [text, outline]   # 只查这些资产类型；剧本（script）台词不过这一类
    suggestion: 平台限制诱导互动与站外引流，改成自然表达或走平台内组件
    words:
      - 点赞关注
      - 关注领取
      - 加微信
      - 加V
      - 私信我
      - 转发抽奖
      - 评论抽奖

# ---------- 事实核查：数字断言缺出处 ----------
facts:
  severity: warn
  applies_to: [text]   # 剧本里的数字是剧情设定，不需要出处
  suggestion: 给数字标出处（据 / 数据显示 / 报告），或改成定性描述。编一个听起来很顺的数字比没有数字更糟
  # 一句话里出现数字 + 量词，且句内没有任何来源标记，就提示
  number_pattern: '\d+(?:\.\d+)?\s*(?:%|％|倍|万|亿|千万|百万|个|人|次|秒|分钟|小时|天|年|元|公里|米)'
  source_markers:
    - 据
    - 来源
    - 数据显示
    - 报告
    - 统计
    - 公布
    - 财报
    - 官方
    - 引自
    - 显示
  max_findings: 5     # 一篇里最多报几处，避免刷屏

# ---------- AIGC 内容标识 ----------
# 《人工智能生成合成内容标识办法》：显式标识（人看得见）+ 隐式标识（元数据）。
# 显式标识在这里查；隐式标识由发布包的 manifest 写入（M16）。
aigc_label:
  severity: block
  applies_to: [text]   # 显式标识查发布正文；剧本/分镜是中间产物
  suggestion: 在正文开头或结尾加一句显式标识（如「本内容由 AI 生成」）；视频/图片在画面角标或简介注明
  text_label: 本内容由 AI 生成
  media_label: 画面需加显式「AI 生成」角标，或在简介 / 描述中注明
  # 正文里出现任一个就算已标识
  explicit_markers:
    - AI生成
    - AI 生成
    - 人工智能生成
    - AIGC
    - 由AI
    - 由 AI
    - AI合成
    - AI 合成
    - AI 创作
    - AI创作

# ---------- 素材版权 ----------
rights:
  severity: warn
  # 版权状态为这些值的素材不得直接进成片
  blocked_states: [unknown]
  suggestion: 素材版权未知，确认授权后再用，或换成自产 / 已授权素材

# ---------- 品牌调性 ----------
# 账号层记忆里 polarity=negative 的关键词出现在正文里就提示（原话一起给）
brand:
  severity: warn
  suggestion: 触碰了账号层禁忌，对照记忆里的原话核对
