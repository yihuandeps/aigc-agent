# ============================================================
# 短视频配方 —— 数据不是代码，改这里就能迭代
# ============================================================
#
# 跑：  agent video "你的主题"
# 换配方：agent video "主题" --recipe 别的配方名
# 临时覆盖：agent video "主题" --duration 45 --tier quality
#
# 想调效果，优先动这个文件，不要改 Python：
#   · 镜头多了/少了       → shots.count
#   · 画面不对味          → shots.style / shots.prompt_hint
#   · 口播太干            → voiceover.instruct / voice
#   · 想换更好的模型      → video.tier 改成 quality
# ============================================================

name: 科技热点短视频
description: 30 秒竖屏科技资讯，快切 + 口播 + 字幕

# ---------- 风格（抖音分支：配方 = 风格，用户先确认风格再开工）----------
style:
  label: 资讯快切
  when: 讲一件正在发生的事或一个新知识点，画面以 AI 生成的意象镜头为主，快切 + 口播 + 字幕
  footage: generate # generate = 画面基本靠生成；real = 实拍为主；mixed = 混合
  min_seconds: 20
  max_seconds: 45

# ---------- 成片规格 ----------
output:
  duration: 30 # **成片**时长（秒）。开了 cut 之后由它说了算，和素材量无关
  aspect_ratio: "9:16" # 竖屏
  resolution: "720p"
  filename: "{topic}_{date}.mp4" # {topic} {date} {tier} 可用

# ---------- 选题接真实热点 ----------
# 开了之后，写文案前先拉真实热榜，让模型在真热点里挑，而不是凭印象编。
# 上一版视频效果差的根因就在这：所谓"科技热点"是编的，内容根基是虚的。
grounding:
  enabled: true
  source: douyin_hot # 抖音热榜（免费额度可用）
  category: 科技 # 热榜分类：科技/体育/财经/军事/娱乐…留空则全量
  top: 15 # 取前几条给模型挑

  # 挑选原则。写清楚比让模型自由发挥有用得多。
  pick_hint: |
    不要直接选热度最高的那条 —— 热度高不等于适合做短视频。
    优先选：话题簇（多条相关热搜同时在榜，说明流量窗口还开着）、
    有视觉表现力、信息增量大（不是换个壳的同质内容）。
    选完用一句话说明为什么选它、为什么不选热度更高的那条。

# ---------- 剪辑节奏 ----------
# 视频模型出片长度是固定档位（veo3.1=8s），要不到 3 秒的片段，
# 真按 3 秒一段去生成，30 秒成片得生成十几段，成本和耗时都是三倍。
# 所以按真实剪辑的做法：素材按模型原生长度生成，节奏在剪辑层做。
cut:
  enabled: true
  max_seconds: 3 # 单个镜头最长几秒 —— 硬约束，不会有任何一刀超过它
  min_seconds: 1.5 # 最短几秒。再短就开始闪了

# ---------- 素材 ----------
# 这里是**素材池**，不是成片镜头数。成片切几刀由 cut.max_seconds 决定。
shots:
  count: 6 # 生成几段素材。段数越多画面越不重复，但成本线性增长
  seconds_each: 8

  # 画面风格，会拼进每个镜头的 prompt
  style: 冷蓝科技色调，浅景深，电影感，镜头运动平缓

  # 给模型写分镜时的指导。改这里最能影响画面走向。
  # 真实感（消 AI 味儿）。只要画面里有真人就该带上，
  # 三个暴露点：皮肤太干净、光太柔、成像太完美。
  # auto = 用全局真实感档位（media_models.yaml drama.realism_level，默认 subtle：真实但干净）。
  # 想固定某段措辞就把 auto 换成文字。2026-09-18 之前这里手写的是重口味那版，
  # 用户看成片说雀斑皱纹太明显，所以统一走档位。
  realism: auto

  prompt_hint: |
    每个镜头都要是**具体可拍的画面**，不是抽象概念。
    写清楚：主体是什么、在做什么动作、镜头怎么运动、光线什么调性。
    避免出现文字、logo、人脸特写（生成模型容易崩）。
    镜头之间要有视觉递进：微观 → 中观 → 人 → 宏观。
    成片是快切（单镜不超过 3 秒），所以每个画面要**一眼能看懂**：
    主体单一、动作明确、构图干净。信息要靠切得密来堆，不是靠单镜头讲完。

# ---------- 口播 ----------
voiceover:
  enabled: true
  # auto = 让模型看着文案的语气挑音色和语速。
  # 同一个音色配所有内容是"听着假"的隐性来源：用新闻女声念生活种草，
  # 语气和内容对不上，哪怕音色本身很自然也别扭。
  # 想固定就把 auto 换成具体音色名（agent models --voices 看全部）。
  voice: auto
  speed: 1.0 # 0.25~4.0。实测这是唯一真正有效的节奏旋钮
  # ⚠️ instruct 实测经 APIMart 转发**不生效**（下"每句停顿三秒"时长毫无变化）。
  #    留着是为了换 provider 时能用，别指望它现在起作用。
  instruct: 冷静清晰，科技资讯口播语气
  # 文案指导。字数按时长估：中文口播约 4.5 字/秒
  script_hint: |
    **这是要念出来的，不是给人读的。**写之前先在心里念一遍。

    节奏（决定配音自不自然，比用什么音色重要得多）：
      · 长短句交替。连着三句都是十几个字，念出来就是播报腔。
      · 敢用短句和不完整句。"是造出来以后，怎么运走。"——这样的句子
        给听感留出呼吸，全是完整主谓宾反而假。
      · 一句只说一件事。一句里塞两个转折，听的人跟不上。
      · 用口语连接词推进（先…再…、然后、问题是、所以），
        **不要用"第一、第二、第三"**。编号是写给眼睛看的，
        念出来立刻变成念报告，这是配音听着假的头号原因。

    内容：
      开头一句给出信息密度最高的钩子，不要寒暄。
      正文讲清楚 3 件具体的事，但要像讲给人听，不是列条目。
      **数字必须有出处**——只能用上面热榜里真实存在的数值，或公认
      无争议的常识。没有可靠数字就用定性对比，宁可少一个数字，
      也不要编一个听起来很顺的。
      结尾一句收束，给出"所以呢"，不要喊口号。

    总字数**不要超过 {chars} 字**。中文口播约 4.5 字/秒，
    写超了配音就会变长，成片时长跟着被拉长（画面要盖住旁白，不能截断）。

# ---------- 字幕 ----------
subtitle:
  enabled: true
  source: asr # 从配音转写，时间轴最准
  language: zh

# ---------- 模型档位 ----------
# fast 最省（验证方向用）· balanced 日常 · quality 成片
models:
  video_tier: fast
  tts_model: "" # 留空用默认

# ---------- 人审断点 ----------
# 视频生成又慢又贵，分镜定错了整批白费。
review:
  after_script: true # 文案和分镜出来后先让人看
  after_compose: false # 成片后是否再确认
