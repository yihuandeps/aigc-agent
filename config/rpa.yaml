# ============================================================
# RPA 行为节奏 —— 保护你自己的账号
# ============================================================
#
# 原则：**放慢并且不规律**，不是伪装身份。
#   做：随机延迟、变距滚动、阅读停顿、会话配额、冷却期
#   不做：指纹伪装 / 验证码识别 / 多身份轮换 / 签名伪造
#
# 默认值偏保守。采 20 条笔记大约要 1.5-3 分钟 —— 这是有意的。
# 觉得太慢可以调，但**别把 action_median 调到 1 秒以下**，
# 那个节奏人做不出来。
# ============================================================

pace:
  # ---------- 动作间隔（秒）----------
  # 用对数正态分布，不是均匀随机 —— 人的间隔是右偏长尾：
  # 大部分时候挺快，偶尔卡很久（看到感兴趣的、走神、切窗口）
  action_median: 1.8 # 中位数
  action_sigma: 0.55 # 越大长尾越明显
  action_min: 0.6
  action_max: 9.0

  # ---------- 滚动 ----------
  scroll_median: 2.4 # 滚一屏后停多久
  scroll_sigma: 0.5
  scroll_distance: [600, 1800] # 每次滚多少像素，随机

  read_every: [3, 6] # 每滚 3-6 次停下来读一会儿
  read_seconds: [4.0, 12.0] # 读多久

  scrollback_chance: 0.18 # 18% 概率往回滚一点（看漏了回看）

  # ---------- 会话配额 ----------
  # 够了就停。挂着一直刷是最容易被盯上的模式。
  max_items: 60 # 单次最多采多少条
  max_minutes: 8.0 # 单次最长跑多久

  # ---------- 换页冷却 ----------
  page_cooldown: [3.0, 9.0] # 换关键词/换页之间停多久

# ---------- 更保守的预设 ----------
# 想更稳就把上面的值换成这组（采同样条数约慢一倍）
# 用法：在 xhs_collect 里传 pace_profile: "cautious"
profiles:
  cautious:
    action_median: 3.2
    action_sigma: 0.6
    scroll_median: 4.5
    read_every: [2, 4]
    read_seconds: [6.0, 18.0]
    max_items: 30
    max_minutes: 6.0
    page_cooldown: [8.0, 20.0]

  # 只在你确认平台宽松、且量很小的时候用
  brisk:
    action_median: 1.1
    action_sigma: 0.45
    scroll_median: 1.6
    read_every: [5, 9]
    read_seconds: [2.0, 6.0]
    max_items: 80
    max_minutes: 10.0
    page_cooldown: [2.0, 5.0]
