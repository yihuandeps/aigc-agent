# ============================================================
# 预期会接的 server（待你确认，见 ARCHITECTURE.md 开放问题 #8）
# ============================================================
#
#   素材库      —— 图/视频/BGM 检索，需返回版权状态字段
#   平台 API    —— 发布、数据拉取
