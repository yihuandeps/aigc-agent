[project]
name = "aigc-agent"
version = "0.1.0"
description = "AIGC 内容创作 Agent —— Loop + Graph 双执行引擎的半自动内容生产 harness"
requires-python = ">=3.11"

# P0 依赖：跑通最小 Loop 所需
# ffmpeg / ffprobe 是外部二进制，不走 pip：
#   Windows: winget install Gyan.FFmpeg  或  choco install ffmpeg
#   验证:    ffmpeg -version
dependencies = [
    "openai>=3.0",              # Kimi 走 OpenAI 兼容协议，AsyncOpenAI；3.0 起底层是 httpx2，网关直接传 httpx2.AsyncClient
    "httpx2>=2.7",              # 网关 / 媒体 / 托管 / 下载等模块直接 import（2026-10-06 补声明，之前靠 openai 顺带装上）
    "pydantic>=2.7",            # 全部 schema
    "pyyaml>=6.0",              # 配置与图定义
    "structlog>=24.1",          # M6 结构化事件
    "typer>=0.12",              # CLI
    "rich>=13.7",               # 终端渲染（流式输出、图状态）
    "prompt_toolkit>=3.0",      # 常驻输入框 + 命令模糊补全（2026-09-22）
    "pillow>=10.3",             # 海报 / 图文卡片本地叠字（make_poster，2026-09-23 从另一份副本移植）
]

[project.optional-dependencies]

# P1：MCP（自带的本地素材库 server 要用）
# 需要 2.x：FastMCP 在 2.x 改名成了 MCPServer。持久化全是 JSON / JSONL 文件，没有用 SQLite
p1 = [
    "mcp>=2.0",                 # M20 MCP Hub，官方 SDK
]

# 浏览器采集（小红书搜索、抖音热榜 RPA）：优先用系统里的 Chrome / Edge
rpa = [
    "playwright>=1.40",
]

# 抖音爆款拆解：报告转 PDF（Python-Markdown + 本机 Chrome / Edge）；没有 TikHub 时 yt-dlp 回退下载
douyin = [
    "markdown>=3.4",
    "yt-dlp",
]

# 原来的 p2 组（fastapi / uvicorn / sse-starlette，Web 人审台用）和 pydantic-settings、aiosqlite
# 在这份代码里都没有被 import，2026-10-06 删掉（2026-09-29 审查 4.6）

dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "import-linter>=2.0",       # 强制 L0 不 import L1/L2
]

[project.scripts]
agent = "aigc_agent.interfaces.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aigc_agent"]


# ---------- 工具配置 ----------

[tool.ruff]
line-length = 100
target-version = "py311"
# vendor/ 是从上游原样拷来的第三方脚本，不改写以便日后同步，也就不按本项目风格检查
extend-exclude = ["src/aigc_agent/domain/functions/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]


# ---------- 架构约束：L0 不得 import L1/L2 ----------
# 这是 ARCHITECTURE.md 里唯一的硬约束，靠自觉守不住，用工具卡。
# 运行：lint-imports

[tool.importlinter]
root_package = "aigc_agent"

[[tool.importlinter.contracts]]
name = "分层依赖严格单向向下"
type = "layers"
layers = [
    "aigc_agent.interfaces",
    "aigc_agent.domain",
    "aigc_agent.capabilities",
    "aigc_agent.harness",
]
